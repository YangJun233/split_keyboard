  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a1a;
    color: #eee;
    padding: 24px;
  }
  h1 { font-size: 16px; font-weight: 500; margin: 0 0 16px; color: #ccc; }
  .layout { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .controls {
    width: 300px;
    flex-shrink: 0;
    background: #242424;
    border-radius: 10px;
    padding: 16px 18px;
  }
  .controls label {
    display: block;
    font-size: 12px;
    color: #999;
    margin: 14px 0 6px;
  }
  .controls label:first-child { margin-top: 0; }
  .controls input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    background: #111;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
  }
  .controls input[type="range"] { width: 100%; }
  .controls input[type="color"] {
    width: 100%;
    height: 32px;
    border: none;
    border-radius: 6px;
    background: none;
    padding: 0;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .row span { font-size: 12px; color: #666; }
  .preview-wrap {
    flex: 1;
    min-width: 320px;
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid #333;
  }
  #stage {
    display: inline-block;
    padding: 60px;
  }
  #stage .line {
    font-family: 'EurostileExt', sans-serif;
    text-transform: uppercase;
    white-space: nowrap;
    line-height: 1;
  }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 10px;
    background: #fff;
    color: #111;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #ddd; }
</style>
</head>
<body>

<h1>Eurostile Extended Black — 实时调整工具</h1>

<div class="layout">
  <div class="controls">
    <label>第一行文字</label>
    <input type="text" id="line1" value="PATIENCE">

    <label>第二行文字</label>
    <input type="text" id="line2" value="ISN'T A VIRTUE">

    <label>第三行文字</label>
    <input type="text" id="line3" value="IT IS THE VIRTUE">

    <div class="row"><label>字号</label><span id="fontSizeVal">150px</span></div>
    <input type="range" id="fontSize" min="40" max="260" value="150">

    <div class="row"><label>字间距</label><span id="letterSpacingVal">7px</span></div>
    <input type="range" id="letterSpacing" min="-10" max="60" value="7">

    <div class="row"><label>行间距</label><span id="lineGapVal">190px</span></div>
    <input type="range" id="lineGap" min="60" max="320" value="190">

    <label>对齐方式</label>
    <select id="align" style="width:100%;padding:8px 10px;background:#111;border:1px solid #3a3a3a;border-radius:6px;color:#fff;font-size:13px;">
      <option value="left" selected>左对齐（首字母对齐）</option>
      <option value="center">居中对齐</option>
    </select>

    <label>文字颜色</label>
    <input type="color" id="textColor" value="#ffffff">

    <label>背景颜色</label>
    <input type="color" id="bgColor" value="#000000">

    <button id="downloadBtn">下载为 PNG</button>
  </div>

  <div class="preview-wrap">
    <div id="stage">
      <div class="line" id="l1"></div>
      <div class="line" id="l2"></div>
      <div class="line" id="l3"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function render() {
  const fs = $('fontSize').value;
  const ls = $('letterSpacing').value;
  const lg = $('lineGap').value;
  const tc = $('textColor').value;
  const bg = $('bgColor').value;
  const align = $('align').value;

  $('fontSizeVal').textContent = fs + 'px';
  $('letterSpacingVal').textContent = ls + 'px';
  $('lineGapVal').textContent = lg + 'px';

  $('stage').style.background = bg;
  $('stage').style.textAlign = align === 'center' ? 'center' : 'left';
  const l1 = $('l1'), l2 = $('l2'), l3 = $('l3');
  l1.textContent = $('line1').value;
  l2.textContent = $('line2').value;
  l3.textContent = $('line3').value;
  [l1, l2, l3].forEach(el => {
    el.style.color = tc;
    el.style.fontSize = fs + 'px';
    el.style.letterSpacing = ls + 'px';
    el.style.display = align === 'center' ? 'block' : 'inline-block';
  });
  l2.style.marginTop = (lg - fs) + 'px';
  l3.style.marginTop = (lg - fs) + 'px';
}

['line1','line2','line3','fontSize','letterSpacing','lineGap','textColor','bgColor','align'].forEach(id => {
  $(id).addEventListener('input', render);
});

document.fonts.load('150px EurostileExt').then(render);
render();

async function doDownload() {
  try {
    // make sure the font is actually ready before we draw with it
    await document.fonts.ready;
    await document.fonts.load('150px EurostileExt');

    const fs = parseFloat($('fontSize').value);
    const ls = parseFloat($('letterSpacing').value);
    const lg = parseFloat($('lineGap').value);
    const pad = 60;
    const align = $('align').value;

    const texts = [$('line1').value.toUpperCase(), $('line2').value.toUpperCase(), $('line3').value.toUpperCase()];

    // measure with a scratch canvas first so width/height are correct
    const measure = document.createElement('canvas').getContext('2d');
    measure.font = fs + 'px EurostileExt';
    function lineWidth(text) {
      let w = 0;
      for (const ch of text) w += measure.measureText(ch).width + ls;
      return w - ls;
    }
    const widths = texts.map(lineWidth);
    const contentW = Math.max(...widths, 10);
    const contentH = lg * 2 + fs;

    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil((contentW + pad * 2) * scale);
    canvas.height = Math.ceil((contentH + pad * 2) * scale);
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = $('bgColor').value;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = fs + 'px EurostileExt';
    ctx.fillStyle = $('textColor').value;
    ctx.textBaseline = 'alphabetic';

    function drawLine(text, w, baselineY) {
      const x0 = align === 'center' ? pad + (contentW - w) / 2 : pad;
      let x = x0;
      for (const ch of text) {
        ctx.fillText(ch, x, baselineY);
        x += ctx.measureText(ch).width + ls;
      }
    }
    const baseline1 = pad + fs * 0.78;
    drawLine(texts[0], widths[0], baseline1);
    drawLine(texts[1], widths[1], baseline1 + lg);
    drawLine(texts[2], widths[2], baseline1 + lg * 2);

    canvas.toBlob((blob) => {
      if (!blob) { alert('导出失败，请重试'); return; }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = 'patience_virtue_eurostile.png';
      link.href = url;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  } catch (err) {
    alert('导出出错: ' + err.message);
    console.error(err);
  }
}

$('downloadBtn').addEventListener('click', doDownload);
</script>

</body>
</html>
